// Keep the existing database, store and key. Never rewrite data during startup.
function openDB(){return new Promise((resolve,reject)=>{
 const r=indexedDB.open(DB,1);
 r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('state'))r.result.createObjectStore('state')};
 r.onsuccess=()=>{r.result.onversionchange=()=>{r.result.close();readOnly=true;storageMessage('База обновлена в другой вкладке. Обнови страницу.');};resolve(r.result)};
 r.onerror=()=>reject(r.error);
 r.onblocked=()=>storageMessage('Закрой другие вкладки HSK Quest и повтори запуск.');
})}
function read(){return new Promise((resolve,reject)=>{
 const tx=db.transaction('state','readonly');const r=tx.objectStore('state').get('main');
 tx.oncomplete=()=>resolve(r.result);tx.onabort=()=>reject(tx.error||new Error('Чтение прервано'));tx.onerror=()=>{};
})}
function write(candidate){return new Promise((resolve,reject)=>{
 const tx=db.transaction('state','readwrite'),store=tx.objectStore('state');let conflict=false;
 // Compare inside the same transaction, so another tab cannot silently overwrite progress.
 const r=store.get('main');
 r.onsuccess=()=>{if(JSON.stringify(r.result)!==savedSnapshot){conflict=true;tx.abort();return}store.put(candidate,'main')};
 tx.oncomplete=()=>resolve();
 tx.onerror=()=>{};
 tx.onabort=()=>reject(new Error(conflict?'Прогресс изменён в другой вкладке. Обнови страницу перед продолжением.':'Не удалось сохранить прогресс. Предыдущие данные сохранены. Повтори действие.'));
})}

async function commit(candidate){
 await write(candidate);

}
const isObject=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
const isCount=x=>Number.isSafeInteger(x)&&x>=0;
const validDay=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!Number.isNaN(Date.parse(x+'T12:00:00'))&&new Date(x+'T12:00:00Z').toISOString().slice(0,10)===x;
function validateState(saved){
 if(saved===undefined)return newState();
 const fail=()=>{throw new Error('Сохранённые данные повреждены или имеют неподдерживаемый формат. Оригинал не изменён. Скачай копию для восстановления.')};
 if(!isObject(saved)||saved.version!==1||!Array.isArray(saved.sessions)||!isObject(saved.wordProgress))fail();
 const copy=structuredClone(saved);
 for(const p of Object.values(copy.wordProgress))if(!isObject(p)||!isCount(p.seen)||!isCount(p.correct)||p.correct>p.seen)fail();
 function session(s,finished){
  if(!isObject(s)||typeof s.id!=='string'||!s.id||!validDay(s.day)||!Array.isArray(s.items)||!s.items.length||new Set(s.items).size!==s.items.length||!Array.isArray(s.answers)||!isCount(s.cursor)||s.cursor>=s.items.length)fail();
  if(s.lessonKey!==undefined&&(typeof s.lessonKey!=='string'||!s.lessonKey))fail();
  if(s.completedDay!==undefined&&!validDay(s.completedDay))fail();
  if(s.optionSets!==undefined&&!isObject(s.optionSets))fail();
  for(const key of s.items){
   if(typeof key!=='string')fail();
   const w=VOCAB.find(w=>w.id===key.replace(/^listen:/,''));if(!w)fail();
   const options=optionsFor(s,key,w);
   if(!Array.isArray(options)||options.length!==4||options.some(x=>typeof x!=='string')||new Set(options).size!==4||!options.includes(w.ru))fail();
  }
  const keys=new Set();
  for(const answer of s.answers){
   if(!isObject(answer))fail();
   const key=answer.questionKey??answer.wordId,position=s.items.indexOf(key);
   if(position<0||keys.has(key)||(!finished&&position>s.cursor))fail();keys.add(key);
   const word=VOCAB.find(w=>w.id===key.replace(/^listen:/,''));
   if(answer.wordId!==word.id||!isCount(answer.choice)||answer.choice>=4||typeof answer.correct!=='boolean'||answer.correct!==(optionsFor(s,key,word)[answer.choice]===word.ru))fail();
   const mode=key.startsWith('listen:')?'listening':'visual';
   if(answer.mode!==undefined&&answer.mode!==mode)fail();
   // Validate legacy answers without rewriting their historical representation.
  }
  if(s.items.slice(0,s.cursor).some(key=>!keys.has(key)))fail();
  if(finished&&(s.answers.length!==s.items.length||s.total!==s.answers.length||s.correct!==s.answers.filter(a=>a.correct).length))fail();
 }
 copy.sessions.forEach(s=>session(s,true));
 if(copy.session!==null)session(copy.session,false);
 validatePinyin(copy.pinyin,fail);
 validateHanzi(copy.hanzi,fail);
 return copy;
}

}
// Аудио воспроизводится из локальных файлов audio/*.mp3; голос устройства не требуется.

 player.preload='auto';player.playbackRate=slow?0.78:1;
 if('preservesPitch' in player)player.preservesPitch=true;

}

function lessonKey(s){return s.lessonKey||'daily:'+s.day}
function uniqueLessons(){return new Set(state.sessions.map(lessonKey)).size}
function home(){let session=state.session,done=todays();let count=uniqueLessons();return `<span class="eyebrow">${safe(new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}))}</span><h1 class="title">Привет, Глеб! 👋</h1><p class="muted">Каждый день — ещё один шаг к китайскому.</p><section class="card hero"><div class="eyebrow">Твоя цель</div><div style="margin-top:10px"><strong>HSK 2</strong> · май 2027</div><p class="muted">Тренируйся понемногу, но регулярно.</p><div class="progress"><div style="width:${Math.min(100,count/40*100)}%"></div></div><div class="mini" style="color:#c4ddd0">${count} занятий завершено · первый этап 40 занятий</div></section><h2 class="section">${done?'Сегодня выполнено ✨':'Тренировка сегодня'}</h2><section class="card"><div class="row"><strong>${done?'Отличная работа!':'Слова и короткий тест'}</strong><span class="pill">${done?'Готово':'15 заданий'}</span></div><div class="task"><div class="taskIcon">字</div><div><div class="taskName">Знакомство со словами</div><small>10 слов · иероглифы и значения</small></div></div><div class="task"><div class="taskIcon">♫</div><div><div class="taskName">Слушай и узнавай</div><small>5 заданий на слух без подсказок</small></div></div><div class="task"><div class="taskIcon">✓</div><div><div class="taskName">Мини-тест</div><small>Автоматическая проверка ответов</small></div></div><p class="muted">${session?'Есть незавершённое занятие — продолжи с последнего вопроса.':done?'Результат сохранён. Можно пройти тренировку ещё раз.':'Уже доступны карточки и задания на слух. Чтение и диалоги добавим позже.'}</p><button class="primary" data-action="${session?'resume':done?'view-result':'start'}">${session?'Продолжить тренировку':done?'Посмотреть результат':'Начать тренировку'} →</button>${done&&!session?'<button class="textbutton" data-action="retry">Пройти ещё раз</button>':''}</section><section class="card"><h2 class="section" style="margin-top:0">Напиши пиньинь</h2><p class="muted">Отдельное упражнение: написание слова и тоны.</p><button class="secondary" data-page="pinyin-menu">Открыть упражнение →</button></section><section class="card"><h2 class="section" style="margin-top:0">Напиши иероглиф</h2><p class="muted">Попробуй написать по памяти, по одной черте.</p><button class="secondary" data-page="hanzi-menu">Открыть упражнение →</button></section><div class="notice">Учебный контент и MP3-озвучка пробные: роботизированный голос, произношение ещё не проверено преподавателем. Не использовать как эталон китайских тонов.</div>`}
function quiz(){
 const s=state.session;if(!s)return home();
 const key=s.items[s.cursor],listening=key.startsWith('listen:');
 const id=listening?key.slice(7):key,item=VOCAB.find(x=>x.id===id);
 if(!item)throw new Error('Слово отсутствует в учебном пакете');
 const prior=s.answers.find(x=>x.questionKey===key||(!x.questionKey&&!listening&&x.wordId===id));
 const isChecked=checked||!!prior,chosen=prior?.choice??selection,options=optionsFor(s,key,item);
 const answers=`<div class="answers">${options.map((a,i)=>`<button class="answer ${chosen===i?'selected':''} ${isChecked&&a===item.ru?'correct':''} ${isChecked&&chosen===i&&a!==item.ru?'wrong':''}" data-choice="${i}" ${isChecked?'disabled':''}>${safe(a)}${isChecked&&a===item.ru?' ✓':isChecked&&chosen===i&&a!==item.ru?' ✕':''}</button>`).join('')}</div>`;
 const header=`<button class="back" data-action="back">← Сегодня</button><div class="row"><span class="eyebrow">Задание ${s.cursor+1} из ${s.items.length}</span><span class="pill">${s.answers.filter(a=>a.correct).length} верно</span></div><div class="progress"><div style="width:${s.cursor/s.items.length*100}%"></div></div>`;
 if(listening){
  const success=isChecked&&options[chosen]===item.ru;
  return `${header}<div class="card listenQuiz"><span class="modeTag">🎧 Аудирование</span><div class="question">Прослушай слово и выбери перевод.</div>
  <div class="listenStage"><button class="listenPlay" data-speak="${id}" aria-label="Слушать слово">▶</button><div class="listenPlayLabel">Слушать слово</div><button class="audioBtn listenSlow" data-speak-slow="${id}">◀ Медленно</button>${!isChecked?'<div class="listenHint">Иероглиф появится после проверки</div>':''}</div>
  <div id="audio-message" class="audioError hidden" role="alert"></div>${answers}
  ${isChecked?`<div class="listenReveal"><div class="listenFeedback ${success?'':'wrong'}">${success?'Верно! 🎉':'Пока не получилось'}</div><div class="listenWord"><strong class="listenWordHanzi" lang="zh-Hans">${safe(item.hanzi)}</strong><span class="listenWordPinyin">${safe(item.pinyin)}</span><button class="listenReplay" data-speak="${id}" aria-label="Повторить произношение">🔊</button></div><div class="listenWordMeaning">${safe(item.ru)}</div><p class="mini" style="margin:10px 0 0">Послушай ещё раз и запомни, как звучит слово.</p></div>`:''}
  <button class="primary ${isChecked?'listenNext':''}" data-action="${isChecked?'next':'check'}" ${!isChecked&&selection===null?'disabled':''}>${isChecked?s.cursor===s.items.length-1?'Завершить тренировку':'Следующее слово →':'Проверить ответ'}</button></div>`;
 }
 return `${header}<div class="card"><span class="modeTag">字 Слова</span><div class="question">Что означает это слово?</div><div class="hanzi" lang="zh-Hans">${safe(item.hanzi)}</div><div class="pinyin">${isChecked?item.pinyin:'Найди правильный перевод'}</div>${audioButtons(id)}${answers}${isChecked?`<div class="feedback ${options[chosen]===item.ru?'':'bad'}"><strong>${options[chosen]===item.ru?'Верно! 🎉':'Пока не получилось'}</strong><br>${safe(item.hanzi)} (${safe(item.pinyin)}) — ${safe(item.ru)}.</div>`:''}<button class="primary" data-action="${isChecked?'next':'check'}" ${!isChecked&&selection===null?'disabled':''}>${isChecked?s.cursor===s.items.length-1?'Завершить тренировку':'Дальше →':'Проверить ответ'}</button></div>`;
}
function result(){const s=state.sessions[state.sessions.length-1];if(!s)return `<div class="empty">Пока нет завершённых занятий</div><button class="secondary" data-page="home">На главную</button>`;return `<button class="back" data-page="home">← Сегодня</button><span class="eyebrow">Тренировка завершена</span><h1 class="title">Хорошая работа! 🎉</h1><div class="card"><div class="muted">Правильных ответов</div><div class="resultNumber">${s.correct}<span style="font-size:22px;color:#95a39a;letter-spacing:0"> / ${s.total}</span></div><div class="progress"><div style="width:${s.total?s.correct/s.total*100:0}%"></div></div><div class="muted">Ошибки помогут выбрать слова для повторения.</div></div><h2 class="section">Повторить слова</h2><div class="card">${s.answers.filter(a=>!a.correct).length?s.answers.filter(a=>!a.correct).map(a=>{let w=VOCAB.find(w=>w.id===a.wordId);return w?`<div class="history"><strong lang="zh-Hans">${w.hanzi}</strong> · ${w.pinyin}<div class="muted">${w.ru} · ${a.mode==='listening'?'На слух':'По иероглифу'}</div></div>`:''}).join(''):'<p class="muted">Сегодня все ответы правильные!</p>'}</div><button class="primary" data-page="progress">Посмотреть прогресс →</button><button class="textbutton" data-action="retry">Пройти ещё раз</button>`}
function vocab(){return `<h1 class="title">Словарь</h1><p class="muted">10 демонстрационных слов с пробной MP3-озвучкой. Счётчики основаны на твоих ответах.</p><div id="audio-message" class="audioError hidden" role="alert"></div><div class="words">${VOCAB.map(w=>{let p=state.wordProgress[w.id]||{seen:0,correct:0};return `<div class="word"><div><strong lang="zh-Hans">${w.hanzi}</strong> <small>${w.pinyin}</small><div class="muted">${w.ru}</div><div class="speakerRow"><button class="audioBtn" data-speak="${w.id}">▶ Слушать</button><button class="audioBtn" data-speak-slow="${w.id}">Медленно</button></div></div><em>${p.seen?`${p.correct}/${p.seen} верно`:'Не проверено'}</em></div>`}).join('')}</div>`}
function progress(){let ss=state.sessions;let answers=ss.flatMap(s=>s.answers);let correct=answers.filter(a=>a.correct).length;let attempted=Object.values(state.wordProgress).filter(v=>v.seen>0).length;return `<h1 class="title">Мой прогресс</h1><p class="muted">Всё, что ты сделал, сохраняется на этом устройстве.</p><div class="statgrid"><div class="stat"><small>Занятий</small><strong>${uniqueLessons()}</strong></div><div class="stat"><small>Проверено слов</small><strong>${attempted}</strong></div><div class="stat"><small>Ответов</small><strong>${answers.length}</strong></div><div class="stat"><small>Точность</small><strong>${answers.length?Math.round(correct/answers.length*100):0}%</strong></div></div><h2 class="section">Аудирование</h2><div class="card">${(()=>{let audio=answers.filter(a=>a.mode==='listening');return audio.length?`<strong>${audio.filter(a=>a.correct).length} из ${audio.length}</strong><p class="muted">Верно на слух · ${Math.round(audio.filter(a=>a.correct).length/audio.length*100)}%</p>`:'<p class="muted">Результаты появятся после пяти аудиозаданий.</p>'})()}</div><h2 class="section">История попыток · ${ss.length}</h2><div class="card">${ss.length?ss.slice().reverse().map(s=>`<div class="history row"><div><strong>${txtDate(s.day)}</strong><div class="mini">Тренировка слов · попытка ${ss.slice(0,ss.indexOf(s)+1).filter(x=>lessonKey(x)===lessonKey(s)).length}</div></div><strong>${s.correct}/${s.total}</strong></div>`).join(''):'<div class="empty">Здесь появятся первые результаты</div>'}</div><h2 class="section">Резервная копия</h2><p class="muted">Выгрузи прогресс перед сменой телефона или браузера.</p><button class="secondary" data-action="export">Скачать JSON с результатами</button><div class="notice">Это локальное хранение: на другом смартфоне результаты автоматически не появятся. Импорт резервной копии подключим на следующем этапе.</div><h2 class="section">Управление данными</h2><button class="secondary" data-action="reset">Сбросить прогресс</button><p class="mini">Удаляет историю и незавершённую тренировку после подтверждения. Перед сбросом скачай резервную копию.</p>`}
// One delegated handler for both persistent navigation and replaceable screen content.
let eventsBound=false;
function bind(){if(eventsBound)return;eventsBound=true;document.addEventListener('click',event=>{
 const el=event.target.closest('button');if(!el||el.disabled||busy)return;
 if(el.dataset.action){void act(el.dataset.action);return}
 if(readOnly||!state)return;
 if(el.dataset.pyTone!==undefined&&page==='pinyin'&&pinyinDraft?.stage==='tones'){pinyinDraft.tones[Number(el.dataset.pySyllable)]=Number(el.dataset.pyTone);render();return}
 if(el.dataset.speak){playWord(el.dataset.speak);return}
 if(el.dataset.speakSlow){playWord(el.dataset.speakSlow,true);return}
 if(el.dataset.page){navigate(el.dataset.page);return}
 if(el.dataset.choice!==undefined){selection=Number(el.dataset.choice);render()}
});document.addEventListener('input',event=>{if(!busy&&!readOnly&&event.target.id==='pinyin-input'&&pinyinDraft?.stage==='input')pinyinDraft.input=event.target.value});
 document.addEventListener('keydown',event=>{if(event.target.id==='pinyin-input'&&event.key==='Enter'&&!event.isComposing){event.preventDefault();void act('py-continue')}});}
function exportData(){
 const blob=new Blob([JSON.stringify(readOnly?rawSaved:state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download=`hsk-quest-backup-${day()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),5000);
}
async function act(action){
 if(busy)return;
 if(action==='export'){exportData();return}
 if(action==='reload'){location.reload();return}
 if(readOnly||!state)return;
 if(action.startsWith('hz-')){await hzAction(action);return}
 if(hzPending)return;
 if(action.startsWith('py-')){await pinyinAction(action);return}
 if(action==='back'){navigate('home');return}
 if(action==='view-result'){navigate('result');return}
 if(action==='resume'){if(state.session)navigate('quiz');return}
 if(!['start','retry','check','next','reset'].includes(action))return;
 if(action==='reset'&&!window.confirm('Сбросить весь прогресс, историю попыток и незавершённую тренировку? Это действие нельзя отменить.'))return;
 if((action==='start'||action==='retry')&&state.session){navigate('quiz');return}
 const candidate=structuredClone(state);let destination=page,advance=false;
 if(action==='reset'){Object.assign(candidate,newState());delete candidate.pinyin;delete candidate.hanzi;destination='progress';advance=true}
 if(action==='start'||action==='retry'){
  const previous=action==='retry'?state.sessions[state.sessions.length-1]:todays();
  candidate.session={id:window.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`,day:day(),lessonKey:previous?lessonKey(previous):'daily:'+day(),items:[...VOCAB.map(x=>x.id),...shuffle(VOCAB).slice(0,5).map(x=>'listen:'+x.id)],optionSets:{},cursor:0,answers:[],startedAt:new Date().toISOString()};
  candidate.session.items.forEach(key=>{candidate.session.optionSets[key]=shuffle(VOCAB.find(w=>w.id===key.replace(/^listen:/,'')).d)});
  destination='quiz';advance=true;
 }
 if(action==='check'||action==='next'){
  const s=candidate.session;if(!s)return;const key=s.items[s.cursor],word=VOCAB.find(w=>w.id===key.replace(/^listen:/,'')),prior=s.answers.find(a=>(a.questionKey??a.wordId)===key);
  if(action==='check'){
   if(prior||!isCount(selection)||selection>=optionsFor(s,key,word).length)return;
   const correct=optionsFor(s,key,word)[selection]===word.ru;
   s.answers.push({questionKey:key,wordId:word.id,mode:key.startsWith('listen:')?'listening':'visual',choice:selection,correct,at:new Date().toISOString()});
   const p=candidate.wordProgress[word.id]||{seen:0,correct:0};p.seen++;if(correct)p.correct++;p.lastSeenAt=new Date().toISOString();candidate.wordProgress[word.id]=p;
  }else{
   if(!prior)return;
   if(s.cursor<s.items.length-1)s.cursor++;
   else{candidate.sessions.push({...s,total:s.answers.length,correct:s.answers.filter(a=>a.correct).length,completedDay:day(),completedAt:new Date().toISOString()});candidate.session=null;destination='result'}
   advance=true;stopAudio();
  }
 }
 setBusy(true);storageMessage('Сохраняем…');
 try{
  await commit(candidate);
  if(advance){stopAudio();selection=null;checked=false}else checked=true;
  if(action==='reset')pinyinDraft=null;
  page=destination;storageMessage('');render();
 }catch(error){console.error(error);storageMessage(error.message||'Не удалось сохранить. Повтори действие.');}
 finally{setBusy(false)}
}
function startupError(err){console.error('HSK Quest startup error:',err);const c=document.querySelector('#content');if(c)c.innerHTML='<h1 class="title">Не удалось запустить HSK Quest</h1><p class="muted">Приложение столкнулось с ошибкой запуска. Ваши прошлые результаты не удалены.</p><section class="card"><p class="muted">Попробуйте обновить страницу без кэша или открыть её в обычном браузере Safari/Chrome. Не очищайте данные сайта.</p><button class="secondary" onclick="location.reload()">Повторить запуск</button><p class="mini" style="margin-top:16px;overflow-wrap:anywhere">Ошибка: '+safe(err?.message||String(err))+'</p></section>'}
window.addEventListener('unhandledrejection',event=>{console.error(event.reason);storageMessage('Не удалось выполнить действие. Сохранённые результаты остались в базе. Обнови страницу.');});
async function startup(){
 bind();
 try{db=await openDB();rawSaved=await read();savedSnapshot=JSON.stringify(rawSaved);
  try{state=validateState(rawSaved)}catch(error){recovery(error);return}
  render();
 }catch(error){readOnly=true;startupError(error)}
}
startup();
</script></body></html>
